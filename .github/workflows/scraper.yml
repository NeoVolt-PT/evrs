name: EV Data Scraper

on:
  schedule:
    # Runs daily at 03:17 UTC (off-peak minute to avoid GitHub Actions 00:00 UTC queue drops)
    - cron: "17 3 * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_KEEPALIVE_TOKEN || github.token }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd scrapers
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cd scrapers
          python main.py

      - name: Keep-Alive Heartbeat (Prevent 60-Day GitHub Action Deactivation)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_KEEPALIVE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Explicitly ensure the workflow stays enabled via GitHub API
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scraper.yml/enable" || true

          # 2. Commit & push updated heartbeat file with [skip ci] so GitHub resets the 60-day
          #    inactivity timer without triggering unnecessary Vercel rebuilds
          if [ ! -f scrapers/last_run.json ]; then
            echo "{\"last_run_utc\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > scrapers/last_run.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrapers/last_run.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(scraper): daily heartbeat $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi


